<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spor Defteri">
<meta name="theme-color" content="#f5f3fb">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Spor ve Beslenme Defteri</title>
<style>
:root{
  --bg:#f5f3fb;--card:#fff;--fg:#1d1a2b;--muted:#6e6a80;--line:#e8e4f2;
  --accent:#5146e0;--accent2:#8b5cf6;--accent-soft:#eeebfe;--warm:#c9601a;--warm-soft:#fdeee2;
  --shadow:0 1px 2px rgba(40,25,90,.05),0 8px 24px rgba(40,25,90,.07);
  --r:20px;--head:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --grad:linear-gradient(135deg,#5146e0 0%,#7c4fe8 55%,#9b5de5 100%);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12111a;--card:#1c1a26;--fg:#f2f0fa;--muted:#a49fb8;--line:#2c2939;
  --accent:#a29bff;--accent2:#c3a6ff;--accent-soft:#262246;--warm:#f2a35e;--warm-soft:#3a281a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
body{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
h1,h2,h3,.big,.num{font-family:var(--head)}
h1{font-size:22px;margin:0;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:16px 0 6px}
p{margin:6px 0}
small,.muted{color:var(--muted)}
a{color:var(--accent)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.hello{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.datenav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:var(--shadow);flex:none}
.datenav button{border:0;background:none;color:var(--fg);border-radius:10px;width:32px;height:32px;font-size:18px}
.datenav button:disabled{opacity:.3}
.datenav span{font:600 13px var(--body);min-width:58px;text-align:center;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.cardHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.cardHead .ic{font-size:18px;margin-right:6px}
.hero{background:var(--grad);color:#fff;border:0}
.hero small,.hero .muted{color:rgba(255,255,255,.82)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 24px);max-width:536px;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:6px;z-index:20;box-shadow:0 10px 30px rgba(40,25,90,.16)}
.tabs button{border:0;background:none;color:var(--muted);font:600 11px var(--body);padding:7px 2px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:#fff;background:var(--grad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:11px 16px;font:650 15px var(--body);cursor:pointer}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(81,70,224,.28)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn.big{padding:16px;font-size:17px;border-radius:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.bar{height:10px;background:var(--accent-soft);border-radius:8px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:8px;transition:width .4s}
.bar.over i{background:var(--warm)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:#fff}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:7px 14px;font:600 14px var(--body)}
.seg button[aria-pressed=true]{background:var(--grad);border-color:transparent;color:#fff}
.opt{border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;background:var(--bg)}
.opt .txt{flex:1;min-width:0}
.opt b{display:block;font-size:15px}
.opt .d{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px}
.tag.fe{color:var(--warm)}.tag.c{color:var(--accent)}
.meta{font-size:13px;font-weight:650;margin-top:3px}
input,select{font:16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
label.f input,label.f select{margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.list .it:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:0 6px;line-height:1}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:11px 12px;margin-bottom:8px;font:550 15px var(--body)}
.chk .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:800;color:transparent;background:var(--card)}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk.on .box{background:var(--grad);border-color:transparent;color:#fff}
.chk small{display:block;font-weight:400}
.ex{border-top:1px solid var(--line);padding:13px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.exHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exHead b{font-size:15px}
.sets{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.sets button{width:48px;height:44px;border-radius:13px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:700 15px var(--head)}
.sets button.on{background:var(--grad);border-color:transparent;color:#fff}
details{margin-top:6px;font-size:14px}
summary{color:var(--accent);font-weight:650;cursor:pointer}
.banner{background:var(--warm-soft);border:1px solid var(--warm);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.banner b{color:var(--warm)}
.note{background:var(--accent-soft);border-radius:14px;padding:11px 13px;font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:650;border-top:0}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(15,10,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:500px;bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;z-index:70;text-align:center}
/* yemek özeti */
.sum{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.ring text{font-family:var(--head)}
.mini b{font-family:var(--head);font-size:17px}
.mini+.mini{margin-top:10px}
/* su */
.water{display:flex;align-items:center;gap:14px}
.glass{width:54px;height:72px;border:3px solid var(--accent);border-top:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#8fb8ff,#5146e0);transition:height .4s}
.wbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.wbtns button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:9px 0;font:700 13px var(--head)}
/* menü */
.menuRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.menuRow:first-child{border-top:0}
.menuRow .ml{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);width:62px;flex:none}
.menuRow .mn{flex:1;min-width:0;font-size:14px}
.menuRow .mn small{display:block}
/* tahmin */
.est{border:2px dashed var(--accent);border-radius:16px;padding:12px;margin:4px 0 10px;background:var(--accent-soft)}
.est .k{font-family:var(--head);font-size:24px;font-weight:700}
/* antrenman */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}
.wk div{border:1px solid var(--line);border-radius:12px;padding:6px 0;background:var(--bg)}
.wk div.on{border:2px solid var(--accent)}
.wk div b{display:block;font-size:12px}
.wk div.dn{background:var(--accent-soft)}
.mvList .it b{font-size:15px}
.mvNo{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font:800 13px var(--head);margin-right:10px;flex:none}
/* seans */
.ses{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:0 auto}
.sesTop{display:flex;align-items:center;gap:10px}
.sesTop .x{font-size:26px}
.sesTop .lbl{flex:1;font:700 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prog{height:6px;background:var(--accent-soft);border-radius:4px;overflow:hidden;margin:8px 0 10px}
.prog i{display:block;height:100%;background:var(--grad)}
.stage{position:relative;flex:1 1 auto;min-height:220px;max-height:48vh;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#ffffff 0%,#ece8fb 60%,#ddd6f7 100%)}
@media (prefers-color-scheme:dark){.stage{background:radial-gradient(120% 90% at 50% 15%,#2c2846 0%,#1f1c32 60%,#18162a 100%)}}
.stage canvas{width:100%!important;height:100%!important;display:block}
.stage .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:72px}
.stage .badge{position:absolute;left:12px;top:12px;background:var(--card);border-radius:12px;padding:5px 10px;font:800 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);box-shadow:var(--shadow)}
.stage .badge.rest{color:var(--warm)}
.mvName{font:700 26px/1.15 var(--head);margin:14px 0 2px;letter-spacing:-.01em}
.mvAlt{font-size:14px;color:var(--muted);min-height:20px}
.clock{font:700 76px/1 var(--head);letter-spacing:-.04em;text-align:center;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.clock small{font-size:20px;letter-spacing:0}
.clock.rest{color:var(--warm)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.doneBox{text-align:center;margin:auto 0}
.doneBox .em{font-size:72px}
/* özet */
.heroGrid{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.heroGrid .kv{font-size:13px;margin:3px 0}
.heroGrid .kv b{font-family:var(--head);font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;box-shadow:var(--shadow);text-align:center}
.tile .em{font-size:22px}
.tile .v{font:700 20px var(--head);margin-top:2px}
.tile small{display:block;font-size:11px;line-height:1.25;margin-top:2px}
.mrow{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .bar{margin:0}
.mrow b{font-family:var(--head)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{text-align:center;border:1px solid var(--line);border-radius:16px;padding:10px 4px;background:var(--bg)}
.bd .em{font-size:26px;line-height:1.1}
.bd b{display:block;font-size:11px;line-height:1.2;margin-top:4px}
.bd small{font-size:10px}
.bd.lock{opacity:.45}
.bd.lock .em{filter:grayscale(1)}
.bd.on{border:2px solid var(--accent);background:var(--accent-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:700}
.cal .c{border:1px solid var(--line);border-radius:11px;padding:4px 1px;min-height:48px;font-size:12px;background:var(--bg)}
.cal .c.today{border:2px solid var(--accent)}
.cal .c.act{background:var(--accent-soft)}
.cal .c .n{font-weight:700}
.cal .c .k{font-size:10px;font-weight:800;color:var(--accent);word-break:break-all;line-height:1.2}
.cal .c.fut{opacity:.35}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--body);fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .tg{stroke:var(--warm);stroke-width:1.5;stroke-dasharray:5 4}
.chart .gr{stroke:var(--line)}
.diff{font-weight:700}
.info details{border-top:1px solid var(--line);padding:11px 0;margin:0}
.info details:first-child{border-top:0;padding-top:0}
.info summary{color:var(--fg);font-size:15px}
</style>
</head>
<body>
<header class="top">
  <div><div class="hello" id="hello"></div><h1>Spor ve Beslenme<br>Defteri</h1></div>
  <div class="datenav">
    <button data-act="dprev" aria-label="Önceki gün">‹</button>
    <span id="dlabel"></span>
    <button data-act="dnext" aria-label="Sonraki gün">›</button>
  </div>
</header>
<div id="banner"></div>
<main id="view"></main>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="yemek"><svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17.5 3c-2.5 2.5-2.5 7 0 9v9"/></svg>Yemek</button>
  <button role="tab" data-tab="spor"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Antrenman</button>
  <button role="tab" data-tab="kardiyo"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-5 3.5 10 2.5-5H21"/></svg>Kardiyo</button>
  <button role="tab" data-tab="olcu"><svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="2"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>Ölçü</button>
  <button role="tab" data-tab="ozet"><svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/></svg>Özet</button>
</nav>
<div id="layer"></div>
<input type="file" id="fileIn" accept="application/json,.json,text/plain" hidden>
<script>
'use strict';
/* ================== TEMEL ================== */
const KEY='spor-defteri-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('tr-TR');
const f1=n=>(Math.round(n*10)/10).toLocaleString('tr-TR');
const GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const TODAY=()=>iso(new Date());
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function nice(s){const d=pd(s);return d.getDate()+' '+AY[d.getMonth()]+' '+GK[d.getDay()]}
function short(s){const d=pd(s);return d.getDate()+' '+AY[d.getMonth()]}
function def(){return{v:2,created:TODAY(),goal:{start:60,target:52,kcal:1450,prot:95,steps:6000,water:2000},days:{},body:[],lastBackup:null,welcomed:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=def();return Object.assign(d,o,{goal:Object.assign(d.goal,o.goal||{})})}}catch(e){}return def()}
let S=load();
let cur=TODAY(),tab='yemek',mealTab='kahvalti',chartM='kg',menuDay=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kayıt yapılamadı! Özet sekmesinden hemen yedek al.')}}
function day(d){d=d||cur;if(!S.days[d])S.days[d]={food:[],sets:{},cardio:[],pil:false,stretch:false,chk:{},wlog:[],steps:null,saved:false};return fix(S.days[d])}
function peek(d){const x=S.days[d];return x?fix(x):x}
function fix(x){if(!x.wlog){x.wlog=[];if(x.water>0)x.wlog.push({t:'',ml:x.water*200});delete x.water}if(!x.chk)x.chk={};if(!x.sets)x.sets={};if(!x.cardio)x.cardio=[];return x}
const waterOf=d=>{const x=peek(d);return x?x.wlog.reduce((a,w)=>a+w.ml,0):0};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function stepGoal(d){const w=Math.floor((pd(d)-pd(S.created))/864e5/7);return w<2?3000:w<4?4500:S.goal.steps}
const MEALS={kahvalti:'Kahvaltı',ara:'Ara öğün',ogle:'Öğle',aksam:'Akşam'};

/* ================== ÖĞÜN HAVUZU ================== */
const POOL={
kahvalti:{h:'~350 kcal',o:[
 {n:'Klasik kahvaltı',d:'2 haşlanmış yumurta, 1 dilim beyaz peynir (30 g), 1 dilim tam buğday ekmek, domates, salatalık, 5 zeytin',k:380,p:23,fe:1},
 {n:'Menemen',d:'2 yumurtalı menemen (1 tatlı kaşığı yağ), 1 dilim tam buğday ekmek, salatalık',k:320,p:17,fe:1},
 {n:'Peynirli omlet',d:'2 yumurta + 2 yemek kaşığı lor + maydanoz, 1 dilim ekmek, domates',k:340,p:23,fe:1},
 {n:'Demir kahvaltısı',d:'2 haşlanmış yumurta, 1 dilim ekmek, 1 tatlı kaşığı tahin + 1 tatlı kaşığı pekmez, roka, 1 portakal',k:355,p:19,fe:1,c:1},

const STOP=new Set(['ve','ile','biraz','cok','kadar','tam','buyuk','kucuk','orta','boy','yedim','ictim','yemek','bi','gibi','olan','tane']);
function matchDB(tk){let best=null,bs=0;
  DBT.forEach((t,i)=>{let s=0,used=new Set();
    tk.forEach(q=>{const wq=MODS[q]?.5:1;let m=0,mi=-1;[...t.main,...t.extra].forEach((w,j)=>{let v=0;if(w===q)v=q.length+2;else{const a=w.length<q.length?w:q,b=w.length<q.length?q:w;if(a.length>=3&&b.startsWith(a))v=a.length*.7}if(v>m){m=v;mi=j}});if(m>0){s+=m*wq;used.add(mi)}else if(!MODS[q])s-=2});

function unitFactor(itemU,qu){const u=trn(itemU);

  if(u.includes('tatli kasigi')){return {kasik:3,tk:1}[qu]||1}
  if(u.startsWith('100 g')){return {porsiyon:1.5,tabak:1.5,dilim:.4,adet:1}[qu]||1}
  if(u.startsWith('porsiyon')||u.startsWith('kase')){return {tabak:1.2,dilim:.5,kasik:.1,tk:.03}[qu]||1}

function estimatePart(part){
  const raw=trn(part).replace(/(\d),(\d)/g,'$1.$2');
  const tk=raw.split(/[^a-z0-9.]+/).filter(Boolean);
  let q=null,qu=null,grams=null;const mods=[],food=[];
  for(let i=0;i<tk.length;i++){const w=tk[i],nx=tk[i+1];
    let m=w.match(/^(\d+(?:\.\d+)?)(g|gr|gram|ml)$/);if(m){grams=+m[1];continue}
    if(/^\d+(\.\d+)?$/.test(w)){if(nx&&/^(g|gr|gram|ml)$/.test(nx)){grams=+w;i++;continue}q=+w;continue}
    if(w==='bucuk'){q=(q||1)+.5;continue}
    if(NUMW[w]!==undefined){q=(q&&w!=='yarim')?q:NUMW[w];continue}
    if((w==='tatli'||w==='cay')&&nx&&nx.startsWith('kasi')){qu='tk';i++;continue}
    const ub=Object.keys(UNITW).find(k=>w===k||w.startsWith(k));if(ub&&w.length<=ub.length+3){qu=UNITW[ub];continue}
    if(STOP.has(w))continue;

  }
  if(!food.length)return null;
  const i=matchDB(food);if(i===null)return{fail:part.trim()};
  const d=DB[i];const name=d[0];const nameT=toks(name);
  let n=q??1;
  if(grams){const u=trn(d[1]);const gm=u.match(/(\d+)\s*(g|ml)/);let per=gm?+gm[1]:(u.startsWith('100 g')?100:u.includes('porsiyon')||u.includes('kase')?250:u.includes('dilim')?80:u.includes('yemek kasigi')?20:u.includes('bardak')?200:100);if(u.startsWith('100 g'))per=100;n=grams/per;qu=null}
  const f=unitFactor(d[1],qu);const units=n*f;
  let k=d[2]*units,p=d[3]*units;const used=[];
  mods.forEach(m=>{if(nameT.includes(m))return;const[a,b,lbl]=MODS[m];if(a<0){k*=1-a}else{k+=a*units;p+=b*units}used.push(lbl)});
  const qtxt=grams?`${f1(grams)} g`:`${f1(n)} ${qu?({tk:'tatlı kaşığı',kasik:'kaşık',avuc:'avuç'}[qu]||qu):d[1]}`;
  return{name,k:Math.round(k),p:Math.round(p*10)/10,fe:d[4],line:`${qtxt} ${name}${used.length?' + '+used.join(', '):''}`};
}
function estimate(text){
  text=text.replace(/(\d),(\d)/g,'$1.$2');

  return{k:ok.reduce((a,r)=>a+r.k,0),p:Math.round(ok.reduce((a,r)=>a+r.p,0)*10)/10,fe:ok.some(r=>r.fe),lines:ok.map(r=>r.line+' ≈ '+fmt(r.k)+' kcal'),fail:fail.map(f=>f.fail)};
}

function chart(B,m,axis){
  const pts=B.filter(b=>b[m]!=null).map(b=>({d:b.d,v:b[m]}));
  if(pts.length<2)return '<p class="muted">Grafik için en az 2 ölçü gerekli.</p>';
  const W=340,H=axis?170:110,L=axis?34:6,R=10,T=14,Bm=axis?26:8;
  let vs=pts.map(p=>p.v);if(m==='kg'&&axis)vs.push(S.goal.target);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<2){mx+=1;mn-=1}
  const x=i=>L+(W-L-R)*(i/(pts.length-1));const y=v=>T+(H-T-Bm)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik">`;
  if(axis)[mn,(mn+mx)/2,mx].forEach(v=>{s+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v)+4}">${f1(v)}</text>`});
  if(m==='kg'&&axis)s+=`<line class="tg" x1="${L}" x2="${W-R}" y1="${y(S.goal.target)}" y2="${y(S.goal.target)}"/><text x="${W-R-40}" y="${y(S.goal.target)-5}">hedef</text>`;
  const line=pts.map((p,i)=>x(i)+','+y(p.v)).join(' ');
  s+=`<polygon class="ar" points="${x(0)},${H-Bm} ${line} ${x(pts.length-1)},${H-Bm}"/><polyline class="ln" points="${line}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="4"/>`});
  if(axis)s+=`<text x="${L}" y="${H-6}">${short(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${short(pts[pts.length-1].d)}</text>`;
  else s+=`<text x="${x(pts.length-1)-4}" y="${y(pts[pts.length-1].v)-9}" text-anchor="end">${f1(pts[pts.length-1].v)}</text>`;
  return s+'</svg>';
}

      r.render(sc,cam);requestAnimationFrame(loop)};
    loop();
    new ResizeObserver(()=>{if(!G3)return;const w=el.clientWidth,h=el.clientHeight;if(w&&h){r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}}).observe(el);
  }catch(e){el.innerHTML='<div class="fb">🏃‍♀️</div>'}}
function setMove(k,speed){if(G3){if(G3.mv!==k)G3.t0=performance.now();G3.mv=k;G3.speed=speed||1}}
function unmount3D(){if(G3){G3.on=false;try{G3.r.dispose()}catch(e){}G3=null}}

/* ================== KARDİYO SEANSI ================== */
let SS=null;
function buildSteps(k){const c=CARDIO[k];const st=[{...c.warm,kind:'warm'}];
  for(let r=0;r<c.rounds;r++)c.mv.forEach((m,i)=>st.push({n:m.n,mv:m.mv,alt:m.alt,s:c.work,kind:'move',r,i,rest:c.rest,lastInRound:i===c.mv.length-1}));
  st.push({...c.cool,kind:'cool'});return st}
function beep(f,ms){try{const a=SS&&SS.ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+ms/1000);o.start();o.stop(a.currentTime+ms/1000)}catch(e){}}
async function sesStart(){
  const k=cardioKey(cur);SS={k,st:buildSteps(k),i:0,ph:'ready',end:0,left:0,paused:false,d:cur,t0:Date.now()};
  try{SS.ac=new (window.AudioContext||window.webkitAudioContext)();await SS.ac.resume()}catch(e){}
  try{if(navigator.wakeLock)SS.wl=await navigator.wakeLock.request('screen')}catch(e){}
  $('#layer').innerHTML=`<div class="ses"><div class="sesTop"><button class="x" data-act="sexit" aria-label="Çık">✕</button><span class="lbl" id="sLbl"></span><small id="sCnt"></small></div>
   <div class="prog"><i id="sProg"></i></div><div class="stage"><div id="cv" style="position:absolute;inset:0"><div class="fb">⏳</div></div><span class="badge" id="sBadge"></span></div>
   <div id="sBody"></div></div>`;
  mount3D($('#cv'));SS.iv=setInterval(sesTick,200);sesDraw();
}
function stepInfo(s){const c=CARDIO[SS.k];if(s.kind==='move')return `Tur ${s.r+1}/${c.rounds} · Hareket ${s.i+1}/${c.mv.length}`;return s.kind==='warm'?'Isınma':'Soğuma'}
function sesDraw(){const s=SS.st[SS.i];const nx=SS.st[SS.i+1];
  $('#sLbl').textContent=stepInfo(s);$('#sCnt').textContent=(SS.i+1)+'/'+SS.st.length;$('#sProg').style.width=(SS.i/SS.st.length*100)+'%';
  const showNext=SS.ph==='rest';const shown=showNext&&nx?nx:s;
  setMove(shown.mv,SS.ph==='rest'?.6:1);
  const bd=$('#sBadge');bd.className='badge'+(SS.ph==='rest'?' rest':'');
  bd.textContent=SS.ph==='rest'?'Dinlen · sıradaki':SS.ph==='work'?'Çalış':SS.ph==='workdone'?'Süre doldu':'Hazırlan';
  let h=`<div class="mvName">${esc(shown.n)}</div><div class="mvAlt">${esc(shown.alt||'')}</div>`;
  const lft=SS.ph==='work'||SS.ph==='rest'?Math.max(0,Math.ceil((SS.end-Date.now())/1000)):null;
  if(SS.ph==='ready'){h+=`<div class="clock">${s.s>=60?Math.round(s.s/60)+'<small> dk</small>':s.s+'<small> sn</small>'}</div><button class="btn pri wide big" data-act="sgo">▶ Başla</button>`}
  else if(SS.ph==='work'){h+=`<div class="clock" id="sClock">${clk(lft)}</div><div class="ctrl"><button class="btn" data-act="spause">${SS.paused?'▶ Devam':'⏸ Duraklat'}</button><button class="btn" data-act="sfin">Bitti ✓</button></div>`}
  else if(SS.ph==='workdone'){
    if(s.kind==='move'&&!(isLast(SS.i))){h+=`<div class="clock">✓</div><button class="btn pri wide big" data-act="srest">😮‍💨 Dinlen (${s.rest} sn)</button><button class="btn wide" style="margin-top:8px" data-act="snext">Dinlenmeden geç ›</button>`}
    else h+=`<div class="clock">✓</div><button class="btn pri wide big" data-act="snext">${nx?(nx.kind==='cool'?'Soğumaya geç ›':'Devam ›'):'Bitir'}</button>`}
  else if(SS.ph==='rest'){h+=`<div class="clock rest" id="sClock">${clk(lft)}</div><div class="ctrl"><button class="btn" data-act="spause">${SS.paused?'▶ Devam':'⏸ Duraklat'}</button><button class="btn" data-act="snext">Dinlenmeyi bitir ›</button></div>`}
  $('#sBody').innerHTML=h}
const clk=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);
const isLast=i=>SS.st[i+1]&&SS.st[i+1].kind==='cool';
function sesTick(){if(!SS||SS.paused)return;if(SS.ph!=='work'&&SS.ph!=='rest')return;
  const left=Math.ceil((SS.end-Date.now())/1000);
  if(left<=0){if(SS.ph==='work')workEnd();else{SS.i++;SS.ph='ready';beep(880,250);sesDraw()}return}
  if(left!==SS.left){SS.left=left;if(left<=3)beep(660,110);const c=$('#sClock');if(c)c.textContent=clk(left)}}
function workEnd(){const s=SS.st[SS.i];beep(988,380);
  if(s.kind==='move'&&s.lastInRound){const x=day(SS.d);x.cardio[s.r]=true;save();toast('Tur '+(s.r+1)+' tamam ✓')}
  if(s.kind==='cool'){sesDone();return}
  SS.ph='workdone';sesDraw()}
function sesDone(){clearInterval(SS.iv);const mins=Math.round((Date.now()-SS.t0)/60000);
  $('#sProg').style.width='100%';setMove('slow',.7);$('#sBadge').textContent='Tamamlandı';
  $('#sLbl').textContent='Kardiyo bitti';
  $('#sBody').innerHTML=`<div class="doneBox"><div class="mvName">Eline sağlık! 🎉</div><p class="muted">${mins} dakika hareket ettin. Bugünkü kardiyo kaydedildi.</p><button class="btn pri wide big" data-act="sclose">Kapat</button></div>`;
  SS.ph='done'}
function sesClose(){if(SS){clearInterval(SS.iv);try{SS.wl&&SS.wl.release()}catch(e){}try{SS.ac&&SS.ac.close()}catch(e){}}SS=null;unmount3D();closeSheet();render()}

/* ================== OLAYLAR ================== */
function addFood(o){const x=day();x.food.push(o);if(o.fe)x.chk.fe=true;if(o.c)x.chk.vc=true;save();render();toast(o.n+' eklendi')}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabs button');if(tb){tab=tb.dataset.tab;render();scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;const x=()=>day();
  switch(a){
   case 'bg':if(e.target===el)closeSheet();break;
   case 'close':closeSheet();break;
   case 'dprev':cur=addD(cur,-1);menuDay=null;render();break;
   case 'dnext':if(cur<TODAY()){cur=addD(cur,1);menuDay=null;render()}break;
   case 'meal':mealTab=el.dataset.k;render();break;
   case 'mday':menuDay=+el.dataset.k;render();break;
   case 'addmenu':{const md=menuDay??pd(cur).getDay();const i=+el.dataset.i;const m=MSLOT[i];const o=POOLIDX[m+'|'+MENU[md][i]];addFood({m,n:o.n,k:o.k,p:o.p,fe:o.fe||0,c:o.c});break}
   case 'addpool':{const o=POOL[mealTab].o[+el.dataset.i];addFood({m:mealTab,n:o.n,k:o.k,p:o.p,fe:o.fe||0,c:o.c});break}
   case 'pickdb':qtySheet(+el.dataset.i);break;
   case 'qset':$('#qq').value=el.dataset.v;break;
   case 'adddb':{const d=DB[+el.dataset.i];const q=parseFloat(String($('#qq').value).replace(',','.'));if(!(q>0)){toast('Miktar gir');break}
     const m=($('#fMeal')||{}).value||mealTab;closeSheet();addFood({m,n:d[0],q:String(q).replace('.',',')+' '+d[1],k:Math.round(d[2]*q),p:Math.round(d[3]*q*10)/10,fe:d[4]});break}
   case 'addest':{if(!estCache)break;const k=parseFloat($('#ek').value);if(!(k>0)){toast('Kalori gir');break}const sc=k/estCache.k;
     addFood({m:$('#fMeal').value,n:estCache.text,q:'tahmini',k:Math.round(k),p:Math.round(estCache.p*sc*10)/10,fe:estCache.fe?1:0});break}
   case 'addmanual':{const k=parseFloat($('#ek2').value);const n=$('#q').value.trim();if(!(k>0)||!n){toast('Kalori gir');break}addFood({m:$('#fMeal').value,n,k:Math.round(k),p:0});break}
   case 'delfood':x().food.splice(+el.dataset.i,1);save();render();break;
   case 'chk':{const c=x().chk;c[el.dataset.k]=!c[el.dataset.k];save();render();break}
   case 'wadd':x().wlog.push({t:nowHM(),ml:+el.dataset.v});save();render();toast('+'+el.dataset.v+' ml su kaydedildi 💧');break;
   case 'waddc':{const v=parseInt($('#wml').value);if(!(v>0)){toast('ml gir');break}x().wlog.push({t:nowHM(),ml:v});save();render();toast('+'+v+' ml su kaydedildi 💧');break}
   case 'wdel':x().wlog.splice(+el.dataset.i,1);save();render();break;
   case 'pil':x().pil=!x().pil;save();render();break;
   case 'stretch':x().stretch=!x().stretch;save();render();break;
   case 'set':{const s=x().sets;const id=el.dataset.id,i=+el.dataset.i;s[id]=s[id]||[];s[id][i]=!s[id][i];save();render();break}
   case 'shape':x().shapeSel=el.dataset.k||null;save();render();break;
   case 'cardio':x().cardioSel=el.dataset.k;x().cardio=[];save();render();break;
   case 'round':{const r=x().cardio;r[+el.dataset.i]=!r[+el.dataset.i];save();render();break}
   case 'sstart':sesStart();break;
   case 'sgo':{const s=SS.st[SS.i];SS.ph='work';SS.paused=false;SS.end=Date.now()+s.s*1000;SS.left=s.s;beep(880,250);sesDraw();break}
   case 'sfin':workEnd();break;
   case 'srest':{const s=SS.st[SS.i];SS.ph='rest';SS.paused=false;SS.end=Date.now()+s.rest*1000;SS.left=s.rest;sesDraw();break}
   case 'snext':{if(SS.i+1>=SS.st.length){sesDone();break}SS.i++;SS.ph='ready';sesDraw();break}
   case 'spause':if(SS.paused){SS.end=Date.now()+SS.left*1000;SS.paused=false}else{SS.left=Math.max(0,Math.ceil((SS.end-Date.now())/1000));SS.paused=true}sesDraw();break;
   case 'sexit':if(SS&&SS.ph!=='done'&&!confirm('Seanstan çıkılsın mı? Biten turlar kayıtlı kalır.'))break;sesClose();break;
   case 'sclose':sesClose();break;
   case 'chart':chartM=el.dataset.k;render();break;
   case 'savebody':{const o={d:cur};let any=false;MS.forEach(([k])=>{const v=parseFloat(String($('#m_'+k).value).replace(',','.'));if(v>0){o[k]=v;any=true}});
     if(!any){toast('En az bir ölçü gir');break}S.body=S.body.filter(b=>b.d!==cur);S.body.push(o);save();render();toast('Ölçü kaydedildi ✓');break}
   case 'delbody':if(confirm('Bu ölçü silinsin mi?')){S.body=S.body.filter(b=>b.d!==el.dataset.d);save();render()}break;
   case 'saveday':saveDaySheet();break;
   case 'dobackup':closeSheet();doBackup();break;
   case 'restore':$('#fileIn').click();break;
   case 'ics':ics();break;
   case 'welcome':S.welcomed=true;save();closeSheet();break;
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.in==='steps'){const v=parseInt(t.value);day().steps=v>=0?v:null;save();toast('Adım kaydedildi')}
  if(t.dataset.g){const v=parseFloat(String(t.value).replace(',','.'));if(v>0){S.goal[t.dataset.g]=v;save();toast('Hedef güncellendi')}}
  if(t.id==='fileIn'&&t.files[0]){restore(t.files[0]);t.value=''}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!SS){if(cur>TODAY())cur=TODAY();render()}});
setInterval(()=>{if(!SS&&!document.hidden)renderBanner()},60000);

render();
if(!S.welcomed)openSheet(`<h2>Hoş geldin 👋</h2><p>Yemeklerin, antrenmanların ve ölçülerin bu defterde.</p><ol>
 <li><b>Hatırlatma kur:</b> Özet sekmesinin altındaki <b>Günlük hatırlatma kur</b> düğmesi her akşam 21:30'da bildirim gönderir.</li>
 <li><b>İlk ölçünü gir:</b> Ölçü sekmesinden kilo, bel, kalça, göğüs ve üst bacak.</li>
 <li><b>Her akşam:</b> Günü kaydet ve yedekle. Yedek dosyasını iCloud Drive'a kaydet.</li></ol>
 <button class="btn pri wide" data-act="welcome">Başlayalım</button>`);
</script>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spor Defteri">
<meta name="theme-color" content="#f6f4f0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Spor ve Beslenme Defteri</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--fg:#1c1b19;--muted:#6b6760;--line:#e3dfd8;--accent:#1f5fbf;--accent-soft:#e6eefb;--warm:#a8510a;--warm-soft:#fdf0e1;--r:14px;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1e1c;--fg:#f1efe9;--muted:#a8a39a;--line:#34322e;--accent:#86b4ff;--accent-soft:#1c2a42;--warm:#f0a95a;--warm-soft:#3a2a17}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:18px;margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
small,.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.datenav{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.datenav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;width:34px;height:34px;font-size:18px}
.datenav button:disabled{opacity:.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.cardHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:8px 2px;border-radius:10px}
.tabs button span{display:block;font-size:19px;line-height:1.1}
.tabs button[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:11px;padding:10px 14px;font:600 15px var(--body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0d1626}}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over i{background:var(--warm)}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:7px 13px;font:600 14px var(--body)}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed=true]{color:#0d1626}}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.opt .txt{flex:1;min-width:0}
.opt b{display:block;font-size:15px}
.opt .d{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tag.fe{color:var(--warm)}
.tag.c{color:var(--accent)}
.meta{font-size:13px;font-weight:600;margin-top:2px}
input,select{font:16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label.f input,label.f select{margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list .it:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 6px}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:11px;padding:10px 12px;margin-bottom:8px;font:500 15px var(--body)}
.chk .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:800;color:transparent}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.chk.on .box{color:#0d1626}}
.chk small{display:block}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.exHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exHead b{font-size:15px}
.sets{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sets button{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:700 14px var(--body)}
.sets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.sets button.on{color:#0d1626}}
details{margin-top:6px;font-size:14px}
summary{color:var(--accent);font-weight:600;cursor:pointer}
details p,details li{color:var(--fg)}
a{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:20px}
.banner{background:var(--warm-soft);border:1px solid var(--warm);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner b{color:var(--warm)}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:600}
.cal .c{border:1px solid var(--line);border-radius:9px;padding:4px 1px;min-height:46px;font-size:12px}
.cal .c.today{border:2px solid var(--accent)}
.cal .c .n{font-weight:700}
.cal .c .k{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--accent);word-break:break-all}
.cal .c.fut{opacity:.35}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
.timer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.timer .phase{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer .phase.work{color:var(--accent)}
.timer .mv{font-size:30px;font-weight:700;margin:6px 0 4px;line-height:1.15}
.timer .sec{font-size:110px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:auto 0 8px;font-variant-numeric:tabular-nums}
.timer .nx{font-size:16px;color:var(--muted);min-height:24px}
.timer .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;z-index:70;text-align:center}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--body);fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .tg{stroke:var(--warm);stroke-width:1.5;stroke-dasharray:5 4}
.chart .gr{stroke:var(--line)}
.diff{font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px}
.wk div{border:1px solid var(--line);border-radius:8px;padding:5px 0}
.wk div.on{border:2px solid var(--accent)}
.wk div b{display:block;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Spor ve Beslenme<br>Defteri</h1></div>
  <div class="datenav">
    <button data-act="dprev" aria-label="Önceki gün">‹</button>
    <span id="dlabel"></span>
    <button data-act="dnext" aria-label="Sonraki gün">›</button>
  </div>
</header>
<div id="banner"></div>
<main id="view"></main>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="yemek" aria-selected="true"><span>🍽</span>Yemek</button>

<div id="layer"></div>
<input type="file" id="fileIn" accept="application/json,.json,text/plain" hidden>
<script>

const KEY='spor-defteri-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('tr-TR');
const f1=n=>(Math.round(n*10)/10).toLocaleString('tr-TR');
const GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const TODAY=()=>iso(new Date());
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function nice(s){const d=pd(s);return d.getDate()+' '+AY[d.getMonth()]+' '+GK[d.getDay()]}
function def(){return{v:1,created:TODAY(),goal:{start:60,target:52,kcal:1450,prot:95,steps:6000},days:{},body:[],lastBackup:null,welcomed:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=def();return Object.assign(d,o,{goal:Object.assign(d.goal,o.goal||{})})}}catch(e){}return def()}
let S=load();
let cur=TODAY();
let tab='yemek';
let mealTab='kahvalti';
let chartM='kg';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kayıt yapılamadı! Özet sekmesinden hemen yedek al.')}}
function day(d){d=d||cur;if(!S.days[d])S.days[d]={food:[],sets:{},cardio:[],pil:false,stretch:false,chk:{},water:0,steps:null,saved:false};return S.days[d]}
function peek(d){return S.days[d]}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* durum yardımcıları */
function shapeKey(d){const x=peek(d);return (x&&x.shapeSel!==undefined)?x.shapeSel:(planOf(d).s||null)}
function cardioKey(d){const x=peek(d);return (x&&x.cardioSel)||planOf(d).c}
function shapeDone(d){const k=shapeKey(d);const x=peek(d);if(!k||!x)return false;const ex=SHAPE[k].ex;let t=0,o=0;ex.forEach(e=>{for(let i=0;i<e.s;i++){t++;if(x.sets[e.id]&&x.sets[e.id][i])o++}});return o>=Math.ceil(t*0.8)}
function cardioDone(d){const x=peek(d);if(!x)return false;const c=CARDIO[cardioKey(d)];return (x.cardio||[]).filter(Boolean).length>=c.rounds}
function kcalOf(d){const x=peek(d);if(!x)return{k:0,p:0};return x.food.reduce((a,f)=>({k:a.k+f.k,p:a.p+f.p}),{k:0,p:0})}

let TM=null;
function beep(f,ms){try{const a=TM.ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+ms/1000);o.start();o.stop(a.currentTime+ms/1000)}catch(e){}}
function buildSteps(k){const c=CARDIO[k];const st=[{n:c.warm,ty:'Isınma',s:c.warmS}];
  for(let r=0;r<c.rounds;r++){c.mv.forEach((m,i)=>{st.push({n:m.n,alt:m.alt,ty:'Çalış · Tur '+(r+1)+'/'+c.rounds,s:c.work,w:1});const last=i===c.mv.length-1;
    if(!(last&&r===c.rounds-1))st.push({n:'Dinlen',ty:'Ara',s:c.rest,nx:last?c.mv[0].n:c.mv[i+1].n,endR:last?r:null});else st.push({n:'Son tur bitti',ty:'Ara',s:3,endR:r})})}
  st.push({n:c.cool,ty:'Soğuma',s:c.coolS});return st}
async function startTimer(){
  const k=cardioKey(cur);TM={k,st:buildSteps(k),i:0,end:0,left:0,paused:false,d:cur};
  try{TM.ac=new (window.AudioContext||window.webkitAudioContext)();await TM.ac.resume()}catch(e){}
  try{if(navigator.wakeLock)TM.wl=await navigator.wakeLock.request('screen')}catch(e){}
  goStep(0);TM.iv=setInterval(tick,200);
}
function goStep(i){TM.i=i;const s=TM.st[i];if(!s){finishTimer();return}
  if(s.endR!=null){const x=day(TM.d);x.cardio=x.cardio||[];x.cardio[s.endR]=true;save()}
  TM.end=Date.now()+s.s*1000;beep(s.w?880:520,s.w?350:200);drawTimer()}
function tick(){if(!TM||TM.paused)return;const left=Math.ceil((TM.end-Date.now())/1000);
  if(left<=0){goStep(TM.i+1);return}
  if(left!==TM.left){TM.left=left;if(left<=3)beep(660,120);const el=$('#tsec');if(el)el.textContent=left}}
function drawTimer(){const s=TM.st[TM.i];const left=Math.ceil((TM.end-Date.now())/1000);TM.left=left;
  const nx=s.nx?'Sıradaki: '+s.nx:(TM.st[TM.i+1]?'Sıradaki: '+(TM.st[TM.i+1].w?TM.st[TM.i+1].n:TM.st[TM.i+1].ty):'Son adım');
  $('#layer').innerHTML=`<div class="timer"><div class="phase ${s.w?'work':''}">${esc(s.ty)}</div><div class="mv">${esc(s.n)}</div><div class="muted">${esc(s.alt||'')}</div>
   <div class="sec" id="tsec">${left}</div><div class="nx">${esc(nx)}</div>
   <div class="ctrl"><button class="btn" data-act="tstop">Bitir</button><button class="btn pri" data-act="tpause">${TM.paused?'Devam':'Duraklat'}</button><button class="btn" data-act="tskip">Atla ›</button></div></div>`}
function finishTimer(){clearInterval(TM.iv);try{TM.wl&&TM.wl.release()}catch(e){}try{TM.ac&&TM.ac.close()}catch(e){}TM=null;closeSheet();render();toast('Kardiyo bitti, eline sağlık ✓')}

/* ================== OLAYLAR ================== */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabs button');if(tb){tab=tb.dataset.tab;render();scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;const x=()=>day();
  switch(a){
   case 'bg':if(e.target===el)closeSheet();break;
   case 'close':closeSheet();break;
   case 'dprev':cur=addD(cur,-1);render();break;
   case 'dnext':if(cur<TODAY()){cur=addD(cur,1);render()}break;
   case 'meal':mealTab=el.dataset.k;render();break;
   case 'addpool':{const o=POOL[mealTab].o[+el.dataset.i];x().food.push({m:mealTab,n:o.n,k:o.k,p:o.p,fe:o.fe||0});if(o.fe)x().chk.fe=true;if(o.c)x().chk.vc=true;save();render();toast(o.n+' eklendi');break}
   case 'pickdb':qtySheet(+el.dataset.i);break;
   case 'qset':$('#qq').value=el.dataset.v;break;
   case 'adddb':{const d=DB[+el.dataset.i];const q=parseFloat(String($('#qq').value).replace(',','.'));if(!(q>0)){toast('Miktar gir');break}
     const m=($('#fMeal')||{}).value||mealTab;x().food.push({m,n:d[0],q:String(q).replace('.',',')+' '+d[1],k:Math.round(d[2]*q),p:Math.round(d[3]*q*10)/10,fe:d[4]});if(d[4])x().chk.fe=true;save();closeSheet();render();toast(d[0]+' eklendi');break}
   case 'quick':{const n=$('#qn').value.trim(),k=parseFloat($('#qk').value),p=parseFloat(String($('#qp').value).replace(',','.'))||0;if(!n||!(k>0)){toast('Ad ve kalori gir');break}
     x().food.push({m:$('#fMeal').value,n,k:Math.round(k),p});save();render();toast(n+' eklendi');break}
   case 'delfood':x().food.splice(+el.dataset.i,1);save();render();break;
   case 'chk':{const c=x().chk;c[el.dataset.k]=!c[el.dataset.k];save();render();break}
   case 'water':x().water=Math.max(0,(x().water||0)+(+el.dataset.d));save();render();break;
   case 'pil':x().pil=!x().pil;save();render();break;
   case 'stretch':x().stretch=!x().stretch;save();render();break;
   case 'set':{const s=x().sets;const id=el.dataset.id,i=+el.dataset.i;s[id]=s[id]||[];s[id][i]=!s[id][i];save();render();break}
   case 'shape':x().shapeSel=el.dataset.k||null;save();render();break;
   case 'cardio':x().cardioSel=el.dataset.k;x().cardio=[];save();render();break;
   case 'round':{const r=x().cardio=x().cardio||[];r[+el.dataset.i]=!r[+el.dataset.i];save();render();break}
   case 'timer':startTimer();break;
   case 'tpause':if(TM){if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false}else{TM.left=Math.ceil((TM.end-Date.now())/1000);TM.paused=true}drawTimer()}break;
   case 'tskip':if(TM)goStep(TM.i+1);break;
   case 'tstop':if(TM)finishTimer();break;
   case 'chart':chartM=el.dataset.k;render();break;
   case 'savebody':{const o={d:cur};let any=false;MS.forEach(([k])=>{const v=parseFloat(String($('#m_'+k).value).replace(',','.'));if(v>0){o[k]=v;any=true}});
     if(!any){toast('En az bir ölçü gir');break}S.body=S.body.filter(b=>b.d!==cur);S.body.push(o);save();render();toast('Ölçü kaydedildi ✓');break}
   case 'delbody':if(confirm('Bu ölçü silinsin mi?')){S.body=S.body.filter(b=>b.d!==el.dataset.d);save();render()}break;
   case 'saveday':saveDaySheet();break;
   case 'dobackup':closeSheet();doBackup();break;
   case 'restore':$('#fileIn').click();break;
   case 'ics':ics();break;
   case 'welcome':S.welcomed=true;save();closeSheet();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.in==='steps'){const v=parseInt(t.value);day().steps=v>=0?v:null;save();toast('Adım kaydedildi')}
  if(t.dataset.g){const v=parseFloat(String(t.value).replace(',','.'));if(v>0){S.goal[t.dataset.g]=v;save();toast('Hedef güncellendi')}}
  if(t.id==='fileIn'&&t.files[0]){restore(t.files[0]);t.value=''}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!TM){const t=TODAY();if(cur>t)cur=t;render()}});
setInterval(()=>{if(!TM&&!document.hidden)renderBanner()},60000);

render();
if(!S.welcomed)openSheet(`<h2>Hoş geldin 👋</h2><p>Bu defter senin için hazırlandı: yemeklerin, antrenmanların ve ölçülerin burada.</p><ol>
 <li><b>Ana ekrana ekle:</b> Safari'de alttaki Paylaş simgesi → <b>Ana Ekrana Ekle</b>. Bundan sonra hep o simgeden aç.</li>
 <li><b>Hatırlatma kur:</b> Özet sekmesinin altındaki <b>Günlük hatırlatma kur</b> düğmesi her akşam 21:30'da bildirim gönderir.</li>
 <li><b>İlk ölçünü gir:</b> Ölçü sekmesinden kilo, bel, kalça, göğüs ve üst bacak.</li>
 <li><b>Her akşam:</b> Günü kaydet ve yedekle. Yedek dosyasını iCloud Drive'a kaydet.</li></ol>
 <button class="btn pri wide" data-act="welcome">Başlayalım</button>`);
</script>
